server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression untuk menghemat bandwidth 20Mbps limit VPS
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;

    # SPA routing - redirect semua unknown paths ke index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets caching untuk meringankan CPU/RAM VPS
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
    }

    # Blokir akses ke dotfiles untuk keamanan
    location ~ /\. {
        deny all;
    }
}
